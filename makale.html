<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beğen ve Yorumla</title>
</head>
<body>
    <div class="post">
        <h2>JavaScript Uygulamaları</h2>
        <button onclick="begen()">Beğen</button>
        <button onclick="yorumEkle()">Yorum Ekle</button>
        <p>Beğeni:<span id="begeniSayisi">0</span></p>
        <div id="yorumlar"></div>
    </div>
</body>
<script>
    let begeniSayisi = 0;

    function begen() {
        begeniSayisi++;
        document.getElementById("begeniSayisi").textContent = begeniSayisi;
    }

    function yorumEkle() {
        let yorum = prompt("Yorumunuzu Buraya Girin:");
        let yorumlarDiv = document.getElementById("yorumlar");
        yorumlarDiv.innerHTML+="<p>Yorumunuz: " + yorum + "</p>";
    }
</script>
</html>
